name: Build APK distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore optional debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
            chmod 600 app/debug.keystore
            keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey > /dev/null
            echo 'Using the stored debug signing key.'
          else
            echo '::warning::No DEBUG_KEYSTORE_BASE64 secret set. This run will create a new debug key; its APK cannot update an APK signed by a different key.'
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and prepare distribution
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          version=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')
          mkdir -p distribution
          filename="RKAVIC-Team-Manager-v${version}-debug.apk"
          cp "$apk" "distribution/$filename"
          (cd distribution && sha256sum "$filename" > SHA256SUMS)
          printf '%s\n' \
            'RKAVIC Team Manager debug APK' \
            "Version: $version" \
            "Commit: $GITHUB_SHA" \
            'This build is for direct installation and testing, not Play Store release.' \
            'If this APK uses a different signing key from an installed copy, Android will not install it as an update.' \
            'Uninstalling the app deletes its local data.' \
            > distribution/INSTALL.txt
          printf '### APK distribution\n\n- `%s`\n- SHA-256 checksum in `SHA256SUMS`\n' "$filename" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: rkavic-team-manager-debug-${{ github.run_number }}
          path: distribution/
          if-no-files-found: error
          retention-days: 30
