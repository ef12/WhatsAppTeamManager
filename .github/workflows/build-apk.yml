name: Build app distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Restore the existing Android debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          else
            keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=RKAVIC,C=NL' -keyalg RSA -keysize 2048 -validity 10000
            echo '::warning::A new debug signing key was created. This APK cannot update an install signed with another key.'
          fi
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey > /dev/null
      - name: Analyze and test
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p distribution/android
          apk=flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$apk"
          cp "$apk" distribution/android/RKAVIC-Team-Manager-Android-v0.3.0-debug.apk
          cd distribution/android
          sha256sum *.apk > SHA256SUMS
          printf '%s\n' 'Install the APK on Android 8.0 or newer.' 'To update an installed copy and keep its local data, use the same debug signing key.' > INSTALL.txt
      - uses: actions/upload-artifact@v7
        with:
          name: RKAVIC-Android-${{ github.run_number }}
          path: distribution/android/
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Build Windows app
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Prepare Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path distribution/windows | Out-Null
          $source = 'flutter_app/build/windows/x64/runner/Release'
          Compress-Archive -Path "$source/*" -DestinationPath distribution/windows/RKAVIC-Team-Manager-Windows-v0.3.0.zip
          (Get-FileHash distribution/windows/*.zip -Algorithm SHA256).Hash | Set-Content distribution/windows/SHA256.txt
          'Extract the entire ZIP, then run rkavic_manager.exe. Keep the data folder and DLLs next to the executable. Data is stored locally for your Windows account.' | Set-Content distribution/windows/INSTALL.txt
      - uses: actions/upload-artifact@v7
        with:
          name: RKAVIC-Windows-${{ github.run_number }}
          path: distribution/windows/
          if-no-files-found: error
          retention-days: 30
